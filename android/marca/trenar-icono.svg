<!-- Ícono de TrenAR (maestro). Lienzo 108x108 como el ícono adaptativo de Android;
     lo importante queda dentro del círculo central de 66. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89F7FE"/>
      <stop offset="1" stop-color="#3D7FE0"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#fondo)"/>
  <!-- Frente del tren: blanco con franja celeste (bandera), faros como el sol. -->
  <rect x="33" y="24" width="42" height="52" rx="10" fill="#FFFFFF"/>
  <rect x="38.5" y="30" width="31" height="17" rx="3.5" fill="#0B2547"/>
  <rect x="33" y="52" width="42" height="5" fill="#74ACDF"/>
  <circle cx="43" cy="66" r="4" fill="#F6B40E"/>
  <circle cx="65" cy="66" r="4" fill="#F6B40E"/>
  <path d="M42 77 L36.5 86 M66 77 L71.5 86" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
</svg>
